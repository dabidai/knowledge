services:
  # ==================== 反向代理 ====================
  nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 256m

  # ==================== 业务数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: kb-postgres
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: ${PG_USER:-kb_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-12345678}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 3g
    command: >
      postgres
        -c shared_buffers=1GB
        -c effective_cache_size=3GB
        -c max_connections=50

  # ==================== 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 1g

  # ==================== 文件存储 ====================
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: kb-minio
    environment:
      # 显式设置凭证，防止 shell 环境变量泄漏覆盖
      MINIO_ROOT_USER: ${MINIO_USER:-kb_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-12345678}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 1g

  # ==================== 检索引擎 ====================
  elasticsearch:
    build: ./config/es
    image: kb-es:8.15.0-ik
    container_name: kb-es
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms4g -Xmx6g"
      - xpack.security.enabled=false
      # 防止 OFD 大文件导入时 ES 拒绝请求体
      - http.max_content_length=500mb
    ports:
      - "9200:9200"
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 8g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ==================== 知识图谱 ====================
  neo4j:
    image: neo4j:5-community
    container_name: kb-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_pass}
      NEO4J_server_memory_heap_initial__size: 2g
      NEO4J_server_memory_heap_max__size: 4g
      NEO4J_server_memory_pagecache_size: 1g
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 6g

  # ==================== AI 服务 ====================
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: kb-ai
    environment:
      # Linux 下 host.docker.internal 通过 extra_hosts 挂载为 host-gateway
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:32b
      EMBEDDING_MODEL: BAAI/bge-large-zh-v1.5
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./data/ai-models:/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 4g

  # ==================== Java 后端 ====================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prebuilt
    container_name: kb-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_USER: ${PG_USER:-kb_user}
      DB_PASSWORD: ${PG_PASSWORD:-kb_pass}
      REDIS_HOST: redis
      ES_HOST: elasticsearch
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-12345678}
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USER: ${MINIO_USER:-kb_admin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-12345678}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-at-least-32-chars}
      IMPORT_ROOT_DIR: /data/documents
    volumes:
      - ./imports:/data/documents
    depends_on:
      - postgres
      - redis
      - elasticsearch
      - neo4j
      - minio
      - ai-service
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 8g

  # ==================== 前端 ====================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: kb-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - kb-net
    mem_limit: 512m

networks:
  kb-net:
    driver: bridge
