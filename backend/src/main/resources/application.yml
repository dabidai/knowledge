server:
  port: 8080

spring:
  application:
    name: knowledge-base

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # HTTP 客户端超时（RestClient 调用 AI 服务用）
  http:
    client:
      connect-timeout: 10s
      read-timeout: 5m

  # 数据源
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/knowledge
    username: ${DB_USER:kb_user}
    password: ${DB_PASSWORD:kb_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 3000ms

  # 文件上传
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 4096MB

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ==================== JWT ====================
jwt:
  secret: ${JWT_SECRET:default-jwt-secret-change-in-production}
  expiration: 86400000  # 24 小时 (毫秒)

# ==================== Elasticsearch ====================
elasticsearch:
  host: ${ES_HOST:localhost}
  port: 9200
  index-name: doc_index

# ==================== MinIO ====================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_USER:kb_admin}
  secret-key: ${MINIO_PASSWORD:12345678}
  bucket-docs: knowledge-docs
  bucket-markdown: knowledge-md
  # 预签名 URL 有效期 (秒)
  presigned-expiry: 604800  # 7 天

# ==================== AI 服务 ====================
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

# ==================== Neo4j ====================
neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USER:neo4j}
  password: ${NEO4J_PASSWORD:neo4j_pass}

# ==================== 文档解析 ====================
document:
  # 导入工作目录（持久化，用于断点续传）
  work-dir: data/import
  # 服务器路径导入允许的根目录
  import-root-dir: ${IMPORT_ROOT_DIR:./input}
  # 文本分块大小 (字符数)
  chunk-size: 512
  # 分块重叠 (字符数)
  chunk-overlap: 64

# ==================== OCR 服务 ====================
ocr:
  # Tesseract 语言数据目录
  tessdata-path: ${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
  # OCR 识别语言（中文简体 + 英文）
  language: chi_sim+eng
  # 渲染 DPI
  dpi: 200

# ==================== PDF 解析 ====================
pdf:
  # 页眉过滤（页面顶部比例）
  header-filter-top: 0.10
  # 页脚过滤（页面底部比例）
  footer-filter-bottom: 0.12
  # 触发 OCR 的最小字符数
  min-text-length: 20
  # 有效字符占比阈值
  min-valid-ratio: 0.45

# ==================== 日志 ====================
logging:
  level:
    com.knowledge: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
