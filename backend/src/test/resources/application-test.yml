spring:
  # 测试用 H2 内存数据库
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 自动建表
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true

  # 文件上传
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 4096MB

# JWT
jwt:
  secret: test-secret-for-unit-tests-only-not-production
  expiration: 86400000

# Elasticsearch (测试时不连接)
elasticsearch:
  host: localhost
  port: 9200
  index-name: test_index

# MinIO (测试时不连接)
minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket-docs: test-docs
  bucket-markdown: test-md
  presigned-expiry: 3600

# AI 服务 (测试时不连接)
ai-service:
  url: http://localhost:8000

# Neo4j (测试时不连接)
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: test

# 文档解析
document:
  temp-dir: ${java.io.tmpdir}/test-parser
  chunk-size: 512
  chunk-overlap: 64
